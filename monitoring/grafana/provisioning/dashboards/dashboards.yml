apiVersion: 1

providers:
  - name: platform
    orgId: 1
    folder: Platform
    type: file
    # File-provisioned so the dashboard lives in git and survives a volume
    # rebuild. Disallowing UI deletion keeps the runbook's deep links valid.
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
