# =============================================================================
# Platform monitoring stack: Prometheus + Alertmanager + Grafana, plus a
# purpose-built postgres_exporter for the Paperclip credential broker.
#
# Self-hosted only, no recurring spend. Every host port is bound to 127.0.0.1;
# put Grafana behind the Cloudflare Tunnel when it needs to be reachable off
# host rather than publishing a port here.
#
#   cp .env.example .env && chmod 600 .env
#   ./scripts/provision-metrics-role.sh --rotate
#   ./scripts/verify-readonly.sh
#   docker compose up -d
#
# Rollback: `docker compose down` removes all four containers and touches
# nothing outside this directory. It creates no schema and holds no state that
# another service reads, so rolling back is a single command with no data
# migration. Named volumes survive `down`; add `-v` only to discard history.
# =============================================================================

name: monitoring

services:
  # ---------------------------------------------------------------------------
  # postgres_exporter, scoped to one job: turning run_identity_contexts into
  # Prometheus metrics. Default collectors are OFF so the DB role can stay at a
  # single SELECT grant instead of needing pg_monitor.
  #
  # There is no other postgres_exporter running against postgres-db (checked
  # against `docker ps` before adding this one), so this is not a duplicate
  # scrape of the same instance.
  # ---------------------------------------------------------------------------
  paperclip-identity-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: paperclip-identity-exporter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Split URI/user/pass rather than a single DSN: the password never has to
      # be URL-encoded, and it does not end up inside a connection string that
      # could be logged whole.
      DATA_SOURCE_URI: "${PAPERCLIP_EXPORTER_HOST}:${PAPERCLIP_EXPORTER_PORT}/${PAPERCLIP_EXPORTER_DB}?sslmode=disable"
      DATA_SOURCE_USER: "${PAPERCLIP_EXPORTER_USER}"
      DATA_SOURCE_PASS: "${PAPERCLIP_EXPORTER_PASSWORD}"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    command:
      # Only the custom queries in queries.yaml. Keeps the grant minimal and the
      # series count at ~10 instead of ~600.
      - --disable-default-metrics
      - --disable-settings-metrics
      - --log.format=logfmt
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    healthcheck:
      # Asserts the exporter can actually reach Postgres and render the custom
      # query, not merely that the HTTP port is open — a metrics page without
      # our series is the failure mode that would leave us blind.
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:9187/metrics | grep -q '^paperclip_identity_context_freshness_seconds'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    networks:
      # postgres-db lives here; joining the existing network avoids publishing
      # another Postgres port or routing metrics scrapes over the host bridge.
      - postgres_network
      - monitoring

  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: platform-prometheus
    restart: unless-stopped
    user: "65534:65534" # nobody; the named volume is chowned by the init below
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30d is enough to review a multi-day outage like RILAAA-75 after the fact
      # while keeping the TSDB small for this handful of series.
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle # POST /-/reload for rule changes, no restart
    ports:
      - "127.0.0.1:9490:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      paperclip-identity-exporter:
        condition: service_started
    networks:
      - monitoring

  # ---------------------------------------------------------------------------
  # Alertmanager. The SMTP password is read from a file, never from this compose
  # file or from alertmanager.yml, so the config itself stays committable.
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: platform-alertmanager
    restart: unless-stopped
    # Runs as the host user that owns this directory (1000), not the image's
    # default `nobody` (65534). The SMTP credential is a mode-600 file owned by
    # uid 1000; as nobody, Alertmanager got "permission denied" reading it and
    # every notification failed. The alternatives were worse — loosening the
    # secret to world-readable, or chowning it to a group this user is not in.
    # Still unprivileged, just a different unprivileged user.
    user: "1000:1000"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --web.external-url=http://127.0.0.1:9493
    ports:
      - "127.0.0.1:9493:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring

  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.1.1
    container_name: platform-grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # No plugin downloads at runtime: the dashboard uses core panels only.
      GF_INSTALL_PLUGINS: ""
    ports:
      - "127.0.0.1:3090:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitoring

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  # Internal-only: nothing in here is reachable except through the 127.0.0.1
  # port bindings above.
  monitoring:
    driver: bridge
  # Created by ../PostgresSQL/docker-compose.yml. Declared external so this
  # stack never tries to own or recreate the database network.
  postgres_network:
    external: true
    name: postgressql_postgres_network
