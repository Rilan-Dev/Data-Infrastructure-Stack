# =============================================================================
# RABBITMQ PRODUCTION CONFIG — Shared Infrastructure
# Version: 3.13 | Profile: Resource-Constrained Single Server
# =============================================================================

# --- NETWORK ---
# Binds to all interfaces (0.0.0.0) by default; no separate .bind/.ip_version keys exist in 3.13.
listeners.tcp.default = 5672

# Management UI
management.listener.port = 15672
management.listener.ip = 0.0.0.0

# --- RESOURCE LIMITS ---
# Memory high watermark (fraction of total RAM available to RabbitMQ)
# 0.6 = 60% of container memory limit (1GB) = 600MB
vm_memory_high_watermark.relative = 0.6

# Disk free space limit (bytes) - 2GB minimum
disk_free_limit.absolute = 2000000000

# --- CONNECTION LIMITS ---
# Per-vhost connection limits are not a global config key in 3.13; set them with:
#   rabbitmqctl set_vhost_limits -p /  '{"max-connections": 1000}'

# Channel limits
channel_max = 2047

# Heartbeat (seconds)
heartbeat = 60

# --- QUEUE MASTER LOCATOR ---
# For single-node, use min-masters
queue_master_locator = min-masters

# --- MESSAGE TTL ---
# There is no global message TTL config key; set a default TTL (7 days) via a
# policy instead, e.g.:
#   rabbitmqctl set_policy TTL ".*" '{"message-ttl":604800000}' --apply-to queues

# --- DEAD LETTER EXCHANGE ---
# Default dead letter exchange for unroutable messages
# dead_letter_exchange = dlx

# --- METRICS & MONITORING ---
# Enable metrics collection (enum: none | coarse | fine)
collect_statistics_interval = 10000
collect_statistics = fine

# --- LOGGING ---
log.console = true
log.console.level = info
log.file = /var/log/rabbitmq/rabbitmq.log
log.file.level = info

# --- PLUGINS ---
# Management plugin enabled by default in management image
# Additional plugins can be enabled in enabled_plugins file

# --- CLUSTERING (DISABLED - SINGLE NODE) ---
# cluster_formation.peer_discovery_backend = classic_config
# cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq