# =============================================================================
# REDIS PRODUCTION CONFIG — Shared Infrastructure (HDD Mitigated)
# Version: 7.4.1 | Profile: Cache-First / HDD Optimized
# =============================================================================

# --- NETWORK ---
bind 0.0.0.0
port 6379
timeout 300
tcp-backlog 511
tcp-keepalive 300

# --- SECURITY ---
# ACL file loaded separately
# requirepass removed - using ACL
protected-mode yes

# --- MEMORY ---
maxmemory 1536mb
maxmemory-policy volatile-lru
maxmemory-samples 5
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# --- PERSISTENCE (HDD MITIGATED: RDB ONLY, NO AOF) ---
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF DISABLED FOR HDD
appendonly no
# appendfilename "appendonly.aof"
# appendfsync everysec
# no-appendfsync-on-rewrite no
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb

# --- REPLICATION (DISABLED - SINGLE NODE) ---
# replicaof no one
# replica-read-only yes

# --- SECURITY HARDENING ---
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""
rename-command EVAL ""
rename-command EVALSHA ""
rename-command SCRIPT ""
rename-command ACL ""
rename-command MODULE ""
rename-command FUNCTION ""
# Monitoring commands kept available for admin:
# rename-command SLOWLOG ""
# rename-command LATENCY ""
# rename-command MONITOR ""
# rename-command MEMORY ""
# rename-command CLIENT ""

# --- PERFORMANCE ---
hz 10
dynamic-hz yes
latency-monitor-threshold 100
list-max-ziplist-entries 512
list-max-ziplist-value 64
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# --- LOGGING ---
loglevel notice
logfile ""
syslog-enabled no

# --- CLIENTS ---
maxclients 10000

# --- THREADING ---
io-threads 2
io-threads-do-reads yes

# --- ACTIVE DEFRAG ---
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 25
active-defrag-cycle-max 75

# --- SLOWLOG ---
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- NOTIFY KEYSPACE EVENTS ---
notify-keyspace-events ""

# --- LUA ---
lua-time-limit 5000
