name: neo4j-production

services:
  neo4j:
    image: ${NEO4J_IMAGE}
    container_name: neo4j
    restart: unless-stopped
    # Run as the host user/group instead of root. Neo4j's entrypoint only
    # recursively chowns its bind-mounted directories (conf, data, logs,
    # import) to its internal `neo4j` user (uid 7474) when it starts as
    # root — running as a non-root user here makes it use the existing
    # ownership instead, so the host user keeps read/write access to its
    # own bind-mounted files. See NEO4J_UID/NEO4J_GID in .env.
    user: "${NEO4J_UID:-1000}:${NEO4J_GID:-1000}"

    secrets:
      - neo4j_auth

    environment:
      # Auth from Docker secret file, not an env var.
      NEO4J_AUTH_FILE: ${NEO4J_AUTH_FILE}
      # Enterprise license — `eval` for dev/evaluation, `yes` for commercial.
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_server_memory_heap_initial__size}
      NEO4J_server_memory_heap_max__size: ${NEO4J_server_memory_heap_max__size}
      NEO4J_server_memory_pagecache_size: ${NEO4J_server_memory_pagecache_size}
      NEO4J_db_tx__log_rotation_retention__policy: ${NEO4J_db_tx__log_rotation_retention__policy}
      # Advertised Bolt/routing hostname — override in .env for Cloudflare Tunnel
      # / reverse-proxy setups. Default is localhost so a cloned repo works
      # without editing neo4j.conf.
      NEO4J_server_bolt_advertised__address: ${NEO4J_BOLT_ADVERTISED_ADDRESS:-localhost:7687}
      NEO4J_server_routing_advertised__address: ${NEO4J_BOLT_ADVERTISED_ADDRESS:-localhost:7687}

      # Network/TLS/memory are configured in config/neo4j.conf, mounted rw below
      # as part of the whole config directory (single source of truth — the
      # entrypoint appends env-derived settings into it at startup).

    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./import:/var/lib/neo4j/import
      - ./plugins:/plugins
      - ./backups:/backups
      - ./config:/var/lib/neo4j/conf
      - ./certificates:/certificates:ro

    ports:
      # HTTPS + TLS Bolt only. Plaintext HTTP is disabled (see neo4j.conf).
      - "${NEO4J_HTTPS_BIND}:7473:7473"
      - "${NEO4J_BOLT_BIND}:7687:7687"
      # Prometheus metrics (bound to localhost by default).
      - "${NEO4J_METRICS_BIND}:2004:2004"
      # HTTP (for Cloudflare Tunnel ingress)
      - "${NEO4J_HTTP_BIND}:7474:7474"

    deploy:
      resources:
        limits:
          memory: ${NEO4J_MEM_LIMIT}
          cpus: ${NEO4J_CPUS}

    healthcheck:
      # curl is not present in the Neo4j image — wget is the only client on PATH.
      # The HTTPS root path (7473) answers 400, which makes wget exit 8 even with
      # --content-on-error, so we probe the Prometheus metrics endpoint (HTTP 200)
      # instead — it is bound to 0.0.0.0:2004 by neo4j.conf.
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:2004/metrics || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

secrets:
  neo4j_auth:
    file: ./secrets/neo4j_auth
