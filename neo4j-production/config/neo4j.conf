# --- Network / listeners ---
server.default_listen_address=0.0.0.0
server.bolt.listen_address=:7687
server.https.listen_address=:7473
server.https.enabled=true
server.http.enabled=true

# --- Memory (host: 4 CPUs / ~12 GiB free; heap 4G + pagecache 4G) ---

# --- Tx-log retention (bounded; monitor growth) ---

# --- TLS: Bolt ---
dbms.ssl.policy.bolt.enabled=true
dbms.ssl.policy.bolt.base_directory=/certificates
dbms.ssl.policy.bolt.private_key=/certificates/bolt/private.key
dbms.ssl.policy.bolt.public_certificate=/certificates/bolt/public.crt

# --- TLS: HTTPS ---
dbms.ssl.policy.https.enabled=true
dbms.ssl.policy.https.base_directory=/certificates
dbms.ssl.policy.https.private_key=/certificates/https/private.key
dbms.ssl.policy.https.public_certificate=/certificates/https/public.crt

# --- Metrics ---
server.metrics.enabled=true
server.metrics.prometheus.enabled=true
server.metrics.prometheus.endpoint=0.0.0.0:2004

# --- Backups enabled ---
server.backup.enabled=true
server.backup.listen_address=0.0.0.0:6362

# Advertised Bolt/routing addresses are set from .env (NEO4J_BOLT_ADVERTISED_ADDRESS)
# so this file is not bound to a single hostname. See docker-compose.yml.

# --- Bolt TLS enforcement ---
server.bolt.tls_level=REQUIRED

server.cluster.advertised_address=15993603e44d:6000

server.cluster.raft.advertised_address=15993603e44d:7000

server.routing.advertised_address=localhost:7687
server.memory.pagecache.size=4G
server.memory.heap.max_size=4G
server.memory.heap.initial_size=4G
server.directories.plugins=/plugins
server.directories.logs=/logs
server.bolt.advertised_address=localhost:7687
db.tx_log.rotation.retention_policy=7 days
